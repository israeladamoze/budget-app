<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #F1F7FB;
  --surface: #FFFFFF;
  --sunk: #EAF4FA;
  --ink: #0B2A3C;
  --muted: #5A7385;
  --line: #D5E5EF;
  --sky: #38BDF8;
  --accent: #0284C7;
  --accent-2: #0EA5E9;
  --accent-soft: #E0F2FE;
  --accent-ink: #FFFFFF;
  --good: #15803D;
  --good-bg: #E8F7EE;
  --warn: #B45309;
  --warn-bg: #FFF6E5;
  --bad: #C62828;
  --bad-bg: #FDECEC;
  --pa: #0EA5E9;
  --pb: #8B5CF6;
  --pj: #14B8A6;
  --font: "Heebo", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --r: 18px;
  --shadow: 0 1px 2px rgba(11, 42, 60, .05), 0 4px 16px rgba(11, 42, 60, .06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.app { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 4px; }
.top h1 { font-size: 22px; font-weight: 800; }
.top .sub { color: var(--muted); font-size: 13.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.card h2 { font-size: 16px; font-weight: 700; }
.label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* hero */
.hero { background: linear-gradient(135deg, #BAE6FD 0%, #7DD3FC 100%); color: #0B2A3C; border-radius: 22px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 8px 24px rgba(2, 132, 199, .25); }
.hero .k { font-size: 13px; color: #164E63; }
.hero .big { font-size: 32px; font-weight: 800; line-height: 1.1; }
.hero .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hero .cols div { background: rgba(255, 255, 255, .5); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.hero .cols b { display: block; font-size: 16px; font-weight: 700; }
.hero .cols span { font-size: 12px; color: #164E63; }

/* progress */
.bar { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset-block: 0; right: 0; border-radius: 99px; background: var(--accent-2); }
.bar.warn > i { background: #F59E0B; }
.bar.bad > i { background: #EF4444; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--sunk); border-radius: 12px; padding: 10px; min-width: 0; }
.stat .v { font-size: 17px; font-weight: 700; }
.stat .k { font-size: 12px; color: var(--muted); }

/* banners */
.banner { border-radius: 14px; padding: 11px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; border: 1px solid; }
.banner.info { background: var(--accent-soft); border-color: #BAE3F8; }
.banner.warn { background: var(--warn-bg); border-color: #F6D9A8; }
.banner.bad { background: var(--bad-bg); border-color: #F5C2C2; }
.banner.good { background: var(--good-bg); border-color: #BFE6CC; }

/* lists */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); min-width: 0; cursor: pointer; background: none; border-inline: 0; border-bottom: 0; text-align: right; width: 100%; }
.li:first-child { border-top: 0; }
.li .main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.li .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .amt { font-weight: 700; white-space: nowrap; text-align: left; display: grid; justify-items: end; }
.li .amt small { font-weight: 500; font-size: 12px; color: var(--muted); }
.li.removed { opacity: .6; }
.li.removed .t { text-decoration: line-through; }
.ic { width: 38px; height: 38px; flex: none; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.ic svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.a { background: #E0F2FE; color: #0369A1; }
.chip.b { background: #EDE9FE; color: #6D28D9; }
.chip.j { background: #CCFBF1; color: #0F766E; }
.chip.now { background: var(--bad-bg); color: var(--bad); }
.chip.month { background: var(--warn-bg); color: var(--warn); }
.chip.later { background: var(--sunk); color: var(--muted); }
.chip.done { background: var(--good-bg); color: var(--good); }
.chip.note { background: #FFF8DB; color: #8A6D00; }

/* room group */
.room { display: grid; gap: 4px; }
.room-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.room-h h2 { font-size: 16px; }

/* segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--sunk); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(11, 42, 60, .12); }

/* fields */
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="month"], input[type="search"], select, textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; min-height: 46px; font-size: 16px; }
input[type="date"], input[type="month"] { -webkit-appearance: none; appearance: none; text-align: right; display: block; }
textarea { min-height: 70px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.money { position: relative; }
.money input { padding-left: 34px; direction: ltr; text-align: right; }
.money::after { content: "₪"; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.hint { font-size: 12.5px; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: center; font-size: 14.5px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 14px; cursor: pointer; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 4px 10px; font-size: 13.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn.link { border: 0; background: none; padding: 2px 0; min-height: 0; color: var(--accent); }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1; }

/* month nav */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthnav h2 { font-size: 17px; }

/* bars chart */
.hbars { display: grid; gap: 10px; }
.hb { display: grid; gap: 4px; }
.hb .row { font-size: 14px; }
.vbars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; height: 150px; }
.vb { display: grid; gap: 4px; align-items: end; height: 100%; grid-template-rows: auto 1fr auto; text-align: center; }
.vb i { display: block; background: var(--sky); border-radius: 8px 8px 3px 3px; min-height: 3px; align-self: end; }
.vb.cur i { background: var(--accent); }
.vb .v { font-size: 11px; color: var(--muted); }
.vb .m { font-size: 12px; font-weight: 600; }

table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: right; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
table.t td.n, table.t th.n { text-align: left; }
.over { color: var(--bad); font-weight: 600; }
.under { color: var(--good); font-weight: 600; }

/* tabs */
.tabs { position: fixed; z-index: 30; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; background: rgba(255, 255, 255, .96); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: 0 8px 28px rgba(11, 42, 60, .14); }
.tabs .in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tabs button { border: 0; background: none; border-radius: 16px; padding: 6px 2px; min-height: 52px; cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 1px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

.fab { position: fixed; z-index: 31; left: max(20px, calc(50% - 260px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 20px; border: 0; background: var(--accent); color: #fff; box-shadow: 0 8px 22px rgba(2, 132, 199, .4); cursor: pointer; display: grid; place-items: center; }
.fab svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(11, 42, 60, .38); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: -6px auto 0; }
.sheet h3 { font-size: 19px; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 22px; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(160px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.count { font-size: 44px; font-weight: 800; line-height: 1; }
.welcome { display: grid; align-content: start; gap: 16px; padding-top: 20px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #38BDF8, #0284C7); display: grid; place-items: center; box-shadow: 0 8px 22px rgba(2, 132, 199, .3); }
.logo svg { width: 34px; height: 34px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.search { position: relative; }
.search input { padding-right: 38px; }
.search svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); }
</style>
</head>
<body>
<div id="main" class="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in"></div></nav>
<button class="fab" id="fab" hidden aria-label="הוספת הוצאה" data-act="add-expense"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<script>

];

  ["arnona", "העברת ארנונה על שמנו"], ["water", "העברת חשבון מים"], ["elec", "העברת חשבון חשמל"],
  ["gas", "העברת / חיבור גז"], ["net", "הזמנת אינטרנט / העברת ספק"], ["vaad", "פרטי ועד בית"],
  ["ins", "ביטוח תכולה"], ["addr", "שינוי כתובת במשרד הפנים"], ["car", "שינוי כתובת ברישיון רכב"],

var storageOK = true;
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    var sr = [[{ v: "סיכום", s: ST.title }], [{ v: gen, s: ST.muted }], null, [{ v: "קטגוריה", s: ST.head }, { v: "סה״כ", s: ST.head }, { v: "אחוז", s: ST.head }]];
    var byCat = {}; spend.forEach(function (x) { byCat[x.cat] = (byCat[x.cat] || 0) + x.amount; });
    var tot = sum(spend, function (x) { return x.amount; });
    var cats = S.settings.cats.filter(function (c) { return byCat[c]; });
    Object.keys(byCat).forEach(function (c) { if (cats.indexOf(c) < 0) cats.push(c); });
    var first = sr.length + 1;
    cats.forEach(function (c) {
      var R = sr.length + 1;
      sr.push([{ v: c }, { f: o.exp ? "SUMIF(" + rng("C") + ',A' + R + "," + rng("B") + ")" : null, v: byCat[c], s: ST.money }, { f: "IF($B$" + (first + cats.length) + "=0,\"\",B" + R + "/$B$" + (first + cats.length) + ")", v: tot ? byCat[c] / tot : "", s: ST.pct }]);
    });
    var TR = sr.length + 1;
    sr.push([{ v: "סה״כ הוצאות", s: ST.sumL }, { f: "SUM(B" + first + ":B" + (TR - 1) + ")", v: tot, s: ST.sumM }, { v: "", s: ST.sumL }]);
    sr.push(null);
    var mt = moveTotals();
    sr.push([{ v: "מעבר דירה", s: ST.head }, { v: "סכום", s: ST.head }]);
    sr.push([{ v: "תקציב מעבר" }, { v: mt.budget, s: ST.money }]);
    sr.push([{ v: "צפי כולל" }, { v: mt.planned, s: ST.money }]);
    sr.push([{ v: "שולם עד כה" }, { v: mt.spent, s: ST.money }]);
    sr.push([{ v: "נשאר בתקציב", s: ST.sumL }, { f: "B" + (sr.length - 2) + "-B" + sr.length, v: mt.budget - mt.spent, s: ST.sumM }]);
    sr.push(null);
    var b = balance();
    var trs = S.transfers.filter(function (t) { var m = ymOf(t.date); return (!o.from || m >= o.from) && (!o.to || m <= o.to); });
    sr.push([{ v: "העברות לחשבון המשותף (" + o.label + ")", s: ST.head }, { v: "סכום", s: ST.head }]);
    sr.push([{ v: nameOf("a") }, { v: sum(trs.filter(function (t) { return t.who === "a"; }), function (t) { return t.amount; }), s: ST.money }]);
    sr.push([{ v: nameOf("b") }, { v: sum(trs.filter(function (t) { return t.who === "b"; }), function (t) { return t.amount; }), s: ST.money }]);
    sr.push(null);
    sr.push([{ v: "איזון בין בני הזוג (50/50, כל התקופה)", s: ST.head }, { v: "סכום", s: ST.head }]);
    sr.push([{ v: nameOf("a") + " – העברות + תשלומים מהחשבון הפרטי" }, { v: b.pa, s: ST.money }]);
    sr.push([{ v: nameOf("b") + " – העברות + תשלומים מהחשבון הפרטי" }, { v: b.pb, s: ST.money }]);
    sr.push([{ v: Math.abs(b.diff) < 1 ? "מאוזנים" : (b.diff > 0 ? nameOf("b") + " מעביר/ה ל" + nameOf("a") : nameOf("a") + " מעביר/ה ל" + nameOf("b")), s: ST.sumL }, { v: Math.abs(b.diff), s: ST.sumM }]);
    sheets.push({ name: "סיכום", rows: sr, widths: [44, 15, 10], freeze: 0, merges: ["A1:C1", "A2:C2"], heights: { 0: 24, 3: 22 } });
  }
  return sheets.filter(function (s) { return !s.hidden; });
}
function exportName(o) { return "budget_" + (o.from ? (o.from === o.to ? o.from : o.from + "_to_" + o.to) : "all_" + today()) + ".xlsx"; }
function makeXlsx() {
  var o = exportOptions();
  if (!o.exp && !o.move && !o.bills && !o.sum) { toast("צריך לבחור לפחות דבר אחד לייצוא"); return null; }
  return { name: exportName(o), blob: buildWorkbook(buildExport(o)) };
}

function exportCsv() {
  var rows = [["תאריך", "סכום", "קטגוריה", "מי שילם", "אמצעי תשלום", "תשלומים", "הערה", "מקור"]];
  allSpending().forEach(function (x) { rows.push([shortDate(x.date), x.amount, x.cat, nameOf(x.payer), x.method, x.inst, x.note, x.src]); });
  var csv = "﻿" + rows.map(function (r) { return r.map(function (v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\r\n");
  offerFile("expenses_" + today() + ".csv", new Blob([csv], { type: "text/csv;charset=utf-8" }));
}
function backup() {
  var data = JSON.stringify(S, null, 1);
  offerFile("budget-backup_" + today() + ".json", new Blob([data], { type: "application/json" })).then(function (st) {
    if (st === "saved") { S.meta.lastBackup = today(); save(); render(); toast("הגיבוי נשמר"); }
  });
}

/* ================= events ================= */
var ACTS = {
  go: function (el) { go(el.dataset.v); },
  close: function () { closeSheet(); },
  "sheet-bg": function (el, ev) { if (ev.target === el) closeSheet(); },
  "add-expense": function () { expenseSheet(null); },
  "edit-expense": function (el) { expenseSheet(el.dataset.id); },
  "delete-expense": function (el) {
    var id = el.dataset.id;
    confirmSheet("למחוק את ההוצאה?", "", [{ label: "מחיקה", cls: "danger", fn: function () { S.expenses = S.expenses.filter(function (x) { return x.id !== id; }); save(); render(); toast("ההוצאה נמחקה"); } }]);
  },
  "add-item": function (el) { itemSheet(null, el.dataset.room); },
  "edit-item": function (el) { itemSheet(el.dataset.id); },
  "remove-item": function (el) { removeItem(el.dataset.id); },
  "delete-item": function (el) { deleteItem(el.dataset.id); },
  "restore-item": function (el) { var i = S.items.find(function (x) { return x.id === el.dataset.id; }); if (i) { i.removed = false; save(); render(); toast("„" + i.name + "” חזר לרשימה"); } },
  "toggle-removed": function () { showRemoved = !showRemoved; render(); },
  "move-tab": function (el) { moveTab = el.dataset.v; render(); },
  "move-filter": function (el) { moveFilter = el.dataset.v; render(); },
  "add-bill": function () { billSheet(null); },
  "edit-bill": function (el) { billSheet(el.dataset.id); },
  "pay-bill": function (el) { payBillSheet(el.dataset.id); },
  "delete-bill": function (el) {
    var id = el.dataset.id;
    confirmSheet("למחוק את החשבון?", "תשלומים שכבר נרשמו יישארו ברשימת ההוצאות. אם הוא פשוט לא רלוונטי – אפשר במקום זה לכבות אותו.", [
      { label: "מחיקה", cls: "danger", fn: function () { S.bills = S.bills.filter(function (x) { return x.id !== id; }); save(); render(); } }]);
  },
  "add-deposit": function () { depositSheet(null); },
  "edit-deposit": function (el) { depositSheet(el.dataset.id); },
  "delete-deposit": function (el) { var id = el.dataset.id; S.deposits = S.deposits.filter(function (x) { return x.id !== id; }); save(); closeSheet(); render(); },
  settle: settleSheet,
  "add-transfer": function () { transferSheet(null); },
  "edit-transfer": function (el) { transferSheet(el.dataset.id); },
  "delete-transfer": function (el) { var id = el.dataset.id; S.transfers = S.transfers.filter(function (x) { return x.id !== id; }); save(); closeSheet(); render(); },
  "exp-month": function (el) { expYm = ymAdd(expYm, +el.dataset.d); render(); },
  "rep-month": function (el) { repYm = ymAdd(repYm, +el.dataset.d); render(); },
  "export-xlsx": function () { var x = makeXlsx(); if (x) offerFile(x.name, x.blob).then(function (s) { if (s === "saved") toast("הקובץ ירד: " + x.name); }); },
  "share-xlsx": function () {
    var x = makeXlsx(); if (!x) return;
    navigator.share({ files: [new File([x.blob], x.name, { type: XLSX_MIME })], title: x.name }).catch(function () {});
  },
  "export-csv": exportCsv,
  backup: backup,
  restore: function () { $("#import-file").click(); },
  reset: function () {
    confirmSheet("למחוק את כל הנתונים?", "כל ההוצאות, הפריטים והחשבונות יימחקו מהמכשיר. מומלץ לשמור גיבוי לפני.", [
      { label: "שמירת גיבוי קודם", cls: "soft", fn: backup },
      { label: "מחיקה והתחלה מחדש", cls: "danger", fn: function () { S = seed(); save(); view = "home"; render(); } }]);
  },
  "add-cat": function () {
    var v = $("#new-cat").value.trim(); if (!v) return;
    if (S.settings.cats.indexOf(v) >= 0) { toast("הקטגוריה כבר קיימת"); return; }
    S.settings.cats.splice(S.settings.cats.length - 1, 0, v); save(); render();
  },
  "del-cat": function (el) {
    var i = +el.dataset.i, c = S.settings.cats[i];
    var used = S.expenses.filter(function (e) { return e.cat === c; }).length + S.bills.filter(function (b) { return b.cat === c; }).length;
    function del() { S.settings.cats.splice(i, 1); save(); render(); }
    if (!used) { del(); return; }
    confirmSheet("למחוק את הקטגוריה „" + esc(c) + "”?", used + " רישומים משתמשים בה. הם ישמרו עליה, אבל לא יהיה אפשר לבחור אותה לרישומים חדשים.", [{ label: "מחיקה", cls: "danger", fn: del }]);
  }
};
document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  var fn = ACTS[el.dataset.act];
  if (fn) { if (el.dataset.act !== "sheet-bg") ev.stopPropagation(); fn(el, ev); }
});
document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t.dataset.act === "check") { S.checklist[t.dataset.k] = t.checked; save(); render(); return; }
  if (t.dataset.meter) { S.meters[t.dataset.meter] = t.value; save(); return; }
  if (t.id === "exp-cat") { expCat = t.value; renderExpList(); return; }
  if (t.id === "x-range") { $("#x-rangebox").hidden = t.value !== "range"; return; }
  if (t.id === "import-file" && t.files[0]) {
    var rd = new FileReader();
    rd.onload = function () {
      var data; try { data = JSON.parse(rd.result); } catch (e) { toast("הקובץ לא נקרא – זה לא קובץ גיבוי"); return; }
      if (!data || !data.settings || !Array.isArray(data.items)) { toast("זה לא קובץ גיבוי של האפליקציה"); return; }
      confirmSheet("לשחזר מהגיבוי?", "הנתונים הנוכחיים במכשיר יוחלפו בנתונים מהקובץ (" + (data.expenses || []).length + " הוצאות, " + data.items.length + " פריטים).", [
        { label: "שחזור", cls: "primary", fn: function () { S = normalize(data); S.setup = true; save(); view = "home"; render(); toast("הנתונים שוחזרו"); } }]);
    };
    rd.readAsText(t.files[0]); t.value = "";
  }
});
document.addEventListener("input", function (ev) {
  if (ev.target.id === "exp-q") { expQuery = ev.target.value; renderExpList(); }
});
document.addEventListener("submit", function (ev) {
  var f = ev.target;
  if (f.id === "welcome-form" || f.id === "settings-form") {
    ev.preventDefault(); var d = formData(f), s = S.settings;
    s.nameA = d.nameA.trim(); s.nameB = d.nameB.trim(); s.moveDate = d.moveDate;
    s.moveBudget = num(d.moveBudget) || 0; s.variable = num(d.variable) || 0;
    if (f.id === "welcome-form") { S.setup = true; view = "home"; } else toast("נשמר");
    save(); render();
  }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && $("#sheet-root").innerHTML) { closeSheet(); return; }
  var t = ev.target;
  if ((ev.key === "Enter" || ev.key === " ") && t.getAttribute && t.getAttribute("role") === "button" && t.dataset.act) { ev.preventDefault(); t.click(); }
});

try { history.replaceState({ v: view }, ""); } catch (e) {}
render();
if ("serviceWorker" in navigator && location.protocol === "https:" && !inViewer) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
})();
</script>
</body>
